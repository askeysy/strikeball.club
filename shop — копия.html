<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.">

  <!-- Google Font с поддержкой кириллицы -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet">

  <style>
    body {
      background: #f4f1ea;
      color: #222;
      font-family: 'Anonymous Pro', monospace;
      font-size: 22px;
      line-height: 1.6;
      padding: 40px;
    }

    .paper {
      max-width: 700px;
      margin: auto;
      background: #fffdf8;
      padding: 40px;
      border: 1px solid #d8d2c8;
      box-shadow:  4px 12px rgba(,,,.08);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
  </style>

  <title>Печатная машинка</title>
</head>
<body>

  <div class="paper">
    <h1>Текст в стиле печатной машинки</h1>

    <p>
      Шрифт Anonymous Pro поддерживает кириллицу и хорошо подходит
      для стилистики старой печатной машинки.
    </p>
  </div>

</body>
</html>
