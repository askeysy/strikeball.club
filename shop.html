<style>
  body {
    margin: ;
    overflow-x: hidden;
    background:
      linear-gradient(rgba(,,,.92), rgba(,,,.92)),
      url('https://images.unsplash.com/photo-151784190524-472988babdf9?q=80&w=160&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    font-family: 'Orbitron', sans-serif;
    color: #f5f5f5;
  }

  .hud-scene {
    position: relative;
    min-height: 100vh;
    padding: 40px 15px;
    overflow: hidden;
  }

  /* CRT SCREEN EFFECT */
  .crt {
    position: fixed;
    inset: ;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.03),
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 3px
      );
    mix-blend-mode: soft-light;
    opacity: .18;
    pointer-events: none;
    z-index: 20;
  }

    position: absolute;
    top: 30px;
    right: 30px;
    width: 180px;
    height: 180px;
    border: 2px solid rgba(255,,,.35);
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
  }
